# auth-service stack. Postgres now lives in the SHARED cluster (harness-shared-postgres),
# reached over the external `harness-shared-pg` network — this module no longer runs its own
# pg (migrated 2026-06-29). All host ports come from .env via ${VAR} (RULES §4.1).
services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "${BACKEND_PORT}:8000"
    # RS256 signing keys injected at runtime, read-only — never baked into the
    # image (#28 P1). JWT_PRIVATE_KEY_PATH / JWT_PUBLIC_KEY_PATH point at /app/keys.
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      mailhog:
        condition: service_started
    # default → reach mailhog + be reachable by frontend; harness-shared-pg → reach postgres.
    networks:
      - default
      - harness-shared-pg

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "${MAILHOG_SMTP_PORT}:1025"
      - "${MAILHOG_HTTP_PORT}:8025"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - auth

# Shared postgres cluster network, created/owned outside this compose project.
networks:
  harness-shared-pg:
    external: true
