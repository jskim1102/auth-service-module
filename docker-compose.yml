# auth-service full stack. Containers are NOT started in phase1 (authoring only).
# postgres-only up = phase3.ckpt0; full-stack up = phase8.ckpt3.
# All host ports come from .env via ${VAR} — no hard-coded numbers (RULES §4.1).
services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "${BACKEND_PORT}:8003"
    # RS256 signing keys injected at runtime, read-only — never baked into the
    # image (#28 P1). JWT_PRIVATE_KEY_PATH / JWT_PUBLIC_KEY_PATH point at /app/keys.
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "${MAILHOG_SMTP_PORT}:1025"
      - "${MAILHOG_HTTP_PORT}:8025"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT}:5176"
    depends_on:
      - auth

volumes:
  postgres_data:
