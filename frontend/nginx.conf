# Static SPA serve for the demo frontend. Container-side port 5176 (compose maps
# ${FRONTEND_PORT}:5176). SPA client routing: unknown paths fall back to index.html.
server {
    listen 5176;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # OAuth landing: the provider success redirect lands on /auth/callback (a
    # frontend SPA route, OAuthCallback.jsx, which reads ?code and POSTs to
    # /auth/oauth/exchange). It must serve the SPA, NOT proxy to the backend.
    # Exact match (=) beats the /auth/ prefix below, so ONLY this path is carved
    # out; every other /auth/* (login/signup/oauth/exchange/health) still proxies.
    location = /auth/callback {
        try_files /index.html =404;
    }

    # Same-origin API: the SPA (api.js BASE='') calls /auth/* on this host, so
    # proxy that prefix to the backend container. Must come before the SPA
    # fallback below, otherwise try_files would serve index.html to API POSTs
    # (→ 405). 'auth' = compose service name; /auth prefix preserved (no trailing
    # slash on proxy_pass). Same-origin → no CORS, httpOnly refresh cookie passes.
    location /auth/ {
        proxy_pass http://auth:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
